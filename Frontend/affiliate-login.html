<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Affiliate Login, Remify</title>
<meta name="description" content="Secure login for Remify affiliates.">
<meta name="theme-color" content="#5b2d82">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<meta name="googlebot" content="noindex, nofollow">

<!-- Favicon / Icons -->
<link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="shortcut icon" href="/favicon.ico">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Remify">
<link rel="manifest" href="/site.webmanifest">

<!-- Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<!-- Styles -->
<link rel="stylesheet" href="affiliate-login.min.css">
</head>
<body>
  <!-- =========================================
     SCROLL PROGRESS
     ========================================= -->

<div class="scroll-progress" aria-hidden="true">
  <div
    class="scroll-progress-fill"
    id="scrollFill"
  ></div>
</div>


<!-- =========================================
     CUSTOM CURSOR
     ========================================= -->

<canvas
  class="cursor-trail"
  id="cursorTrail"
></canvas>

<div
  class="cursor-spark"
  id="cursorSpark"
>
  <span></span>
</div>


  <main class="affiliate-auth">

    <section class="affiliate-auth-card">

      <div class="affiliate-auth-brand">
        <span>REMIFY</span>
      </div>

      <div class="affiliate-auth-heading">
        <p class="eyebrow">AFFILIATE PROGRAM</p>

        <h1>Welcome back.</h1>

        <p>
          Sign in to your Remify affiliate account
          and manage your referrals.
        </p>
      </div>

      <form id="affiliateLoginForm">

        <div class="form-field">
          <label for="affiliateEmail">
            Email address
          </label>

          <input
            type="email"
            id="affiliateEmail"
            name="email"
            autocomplete="email"
            placeholder="you@example.com"
            required
          >
        </div>

        <div class="form-field">
          <label for="affiliatePassword">
            Password
          </label>

          <input
            type="password"
            id="affiliatePassword"
            name="password"
            autocomplete="current-password"
            placeholder="Enter your password"
            required
          >
        </div>

        <div
          id="affiliateLoginMessage"
          class="affiliate-auth-message"
          aria-live="polite"
        ></div>

        <button
          type="submit"
          id="affiliateLoginButton"
        >
          <span class="button-text">
            Sign in
          </span>

          <span
            class="button-loader"
            aria-hidden="true"
          ></span>
        </button>

      </form>

      <div class="affiliate-auth-footer">

        <p>
          Don't have an affiliate account?
        </p>

        <a href="affiliate-register.html">
          Apply to become an affiliate
        </a>

      </div>

    </section>

  </main>

  <script src="affiliate-login.min.js"></script>
<!-- Lenis -->
<script src="https://unpkg.com/lenis@1.3.8/dist/lenis.min.js"></script>

<!-- Your scripts -->
<script src="./lenis.min.js"></script>
</body>
</html>
