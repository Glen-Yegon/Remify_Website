<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Owner Login, Remify</title>
<meta name="description" content="Secure owner login for the Remify management dashboard.">
<meta name="theme-color" content="#5b2d82">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<meta name="googlebot" content="noindex, nofollow">

<!-- Favicon / Icons -->
<link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="shortcut icon" href="/favicon.ico">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Remify">
<link rel="manifest" href="/site.webmanifest">

<!-- Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">

<!-- Styles -->
<link rel="stylesheet" href="owner-login.min.css">
</head>


<body>
    <!-- =========================================
     SCROLL PROGRESS
     ========================================= -->

<div class="scroll-progress" aria-hidden="true">
  <div
    class="scroll-progress-fill"
    id="scrollFill"
  ></div>
</div>


<!-- =========================================
     CUSTOM CURSOR
     ========================================= -->

<canvas
  class="cursor-trail"
  id="cursorTrail"
></canvas>

<div
  class="cursor-spark"
  id="cursorSpark"
>
  <span></span>
</div>


  <main class="owner-login-page">

    <section class="owner-login-card">

<div class="sidebar-brand">
  <a href="index.html" aria-label="Remify home">
    <img src="images/rem-logo-mainb.png" alt="Remify">
  </a>
</div>


      <p class="owner-login-eyebrow">
        ADMINISTRATION
      </p>

      <h1>
        Owner login.
      </h1>

      <p class="owner-login-description">
        Sign in to manage the Remify affiliate program.
      </p>


      <form id="ownerLoginForm">

        <div class="owner-field">

          <label for="username">
            Username
          </label>

          <input
            type="text"
            id="username"
            name="username"
            autocomplete="username"
            required
          >

        </div>


        <div class="owner-field">

          <label for="password">
            Password
          </label>

          <input
            type="password"
            id="password"
            name="password"
            autocomplete="current-password"
            required
          >

        </div>


        <button
          type="submit"
          id="ownerLoginButton"
        >
          Sign in
        </button>


        <div
          id="ownerLoginError"
          class="owner-login-error"
          aria-live="polite"
        ></div>

      </form>

    </section>

  </main>


  <script src="owner-login.min.js"></script>
<!-- Lenis -->
<script src="https://unpkg.com/lenis@1.3.8/dist/lenis.min.js"></script>

<!-- Your scripts -->
<script src="./lenis.min.js"></script>
</body>

</html>
